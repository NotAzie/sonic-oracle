[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-song-finder"
version = "3.0.0"
description = "SonicOracle - Autonomous Memetic Outbreak Radar & Hyperdimensional Audio Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "NotAzie", email = "mazinullah317@gmail.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.scripts]
yt-song-finder = "main:main"
sonic-oracle = "main:main"
oracle = "main:main"
